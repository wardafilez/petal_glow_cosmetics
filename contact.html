<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Petal Glow Cosmetics</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: #121212;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #a30000;
        }
        nav .logo {
            font-size: 24px;
            font-weight: bold;
            color: #d62027;
            letter-spacing: 2px;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        nav ul li {
            margin-left: 30px;
        }
        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }
        nav ul li a:hover {
            color: #d62027;
        }
        .contact-container {
            max-width: 600px;
            margin: 60px auto;
            background-color: #121212;
            padding: 40px;
            border-radius: 8px;
            border: 1px solid #a30000;
            box-sizing: border-box;
            box-shadow: 0px 0px 20px rgba(163, 0, 0, 0.2);
        }
        .contact-container h2 {
            color: #d62027;
            text-align: center;
            margin-bottom: 10px;
        }
        .contact-container p {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #dddddd;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background-color: #000000;
            border: 1px solid #444;
            color: #ffffff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #d62027;
            outline: none;
        }
        .submit-btn {
            width: 100%;
            background-color: #a30000;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
        }
        .submit-btn:hover {
            background-color: #d62027;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #121212;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #222;
            margin-top: 50px;
        }
        @media (max-width: 768px) {
            nav { flex-direction: column; padding: 15px; }
            nav ul { margin-top: 15px; }
            nav ul li { margin: 0 10px; }
            .contact-container { margin: 30px 15px; padding: 25px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">PETAL GLOW</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="contact-container">
        <h2>Get In Touch</h2>
        <p>Have questions? We'd love to hear from you.</p>
        <form>
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea rows="5" placeholder="How can we help you?" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>

    <footer>
        &copy; 2026 Petal Glow Cosmetics. All Rights Reserved.
    </footer>

</body>
</html>
