<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petal Glow Cosmetics | Luxury Makeup</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: #121212;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #a30000;
        }
        nav .logo {
            font-size: 24px;
            font-weight: bold;
            color: #d62027;
            letter-spacing: 2px;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        nav ul li {
            margin-left: 30px;
        }
        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }
        nav ul li a:hover {
            color: #d62027;
        }
        
        /* --- NEW HERO LAYOUT (Side-by-Side) --- */
        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }
        .hero-text {
            flex: 1;
        }
        .hero-text h1 {
            font-size: 50px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .hero-text h1 span {
            color: #d62027;
        }
        .hero-text p {
            font-size: 18px;
            color: #cccccc;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .hero-text .btn {
            background-color: #a30000;
            color: white;
            padding: 14px 35px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.3s;
            display: inline-block;
        }
        .hero-text .btn:hover {
            background-color: #d62027;
            box-shadow: 0 0 15px #d62027;
        }
        .hero-image-box {
            flex: 1;
            text-align: center;
        }
        /* ⬇️ Isse aapki image bina kate bilkul poori aur saaf dikhegi */
        .hero-image-box img {
            max-width: 100%;
            height: auto;
            max-height: 450px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(214, 32, 39, 0.2);
            border: 1px solid #1a1a1a;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            background-color: #121212;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #222;
            margin-top: 40px;
        }

        /* 📱 MOBILE RESPONSIVE (Phone par image text ke niche aa jayegi automatic) */
        @media (max-width: 768px) {
            nav { flex-direction: column; padding: 15px; }
            nav ul { margin-top: 15px; }
            nav ul li { margin: 0 10px; }
            .hero-container { flex-direction: column-reverse; text-align: center; padding: 30px 20px; }
            .hero-text h1 { font-size: 36px; }
            .hero-image-box img { max-height: 350px; }
        }
    </style>
</head>
<body>

    <!-- NAV BAR -->
    <nav>
        <div class="logo">PETAL GLOW</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- NEW HERO SECTION -->
    <div class="hero-container">
        <div class="hero-text">
            <h1>Welcome to <br><span>Petal Glow</span></h1>
            <p>Bold Colors. Premium Quality. Unleash Your Inner Diva.</p>
            <a href="shop.html" class="btn">Explore Shop</a>
        </div>
        <div class="hero-image-box">
            <!-- ⬇️ Aapki model ki picture bina kate poori yahan dikhegi -->
            <img src="model.png" alt="Petal Glow Model">
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        &copy; 2026 Petal Glow Cosmetics. All Rights Reserved.
    </footer>

</body>
</html>
