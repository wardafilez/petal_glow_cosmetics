<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petal Glow Cosmetics | Luxury Makeup</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: #121212;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #a30000;
        }
        nav .logo {
            font-size: 24px;
            font-weight: bold;
            color: #d62027;
            letter-spacing: 2px;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        nav ul li {
            margin-left: 30px;
        }
        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }
        nav ul li a:hover {
            color: #d62027;
        }
        .hero {
            text-align: center;
            padding: 80px 20px;
            /* ⬇️ Yahan humne aapki saved picture 'model.png' ka direct link lga diya hai */
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.85)), 
                        url('model.png') no-repeat center center/cover;
        }
        .hero h1 {
            font-size: 50px;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        .hero h1 span {
            color: #d62027;
        }
        .hero p {
            font-size: 18px;
            color: #cccccc;
            margin-bottom: 30px;
        }
        .hero .btn {
            background-color: #a30000;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.3s;
            display: inline-block;
        }
        .hero .btn:hover {
            background-color: #d62027;
            box-shadow: 0 0 15px #d62027;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #121212;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #222;
            position: absolute;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;
        }
        @media (max-width: 768px) {
            nav { flex-direction: column; padding: 15px; }
            nav ul { margin-top: 15px; }
            nav ul li { margin: 0 10px; }
            .hero { padding: 100px 15px; }
            .hero h1 { font-size: 32px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">PETAL GLOW</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="hero">
        <h1>Welcome to <span>Petal Glow</span></h1>
        <p>Bold Colors. Premium Quality. Unleash Your Inner Diva.</p>
        <a href="shop.html" class="btn">Explore Shop</a>
    </div>

    <footer>
        &copy; 2026 Petal Glow Cosmetics. All Rights Reserved.
    </footer>

</body>
</html>
